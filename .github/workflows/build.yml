name: Build debug APK

on:
  push:
    branches: [main]
    # Documentation-only changes do not need a build. Tags are never built.
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '**.txt'
      - 'LICENSE'
    tags-ignore: ['**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Best effort: the runner image normally has licenses accepted already. Never fail the build here.
      - name: Accept SDK licenses (best effort)
        continue-on-error: true
        run: yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug -PbuildNumber=${{ github.run_number }} 2>&1 | tee build.log
        shell: bash

      - name: Show compiler errors (e: lines)
        if: always()
        shell: bash
        run: grep -E '^(e|w): ' build.log | head -100 || true

      - name: Rename APK with build number
        shell: bash
        run: |
          set -e
          SRC=$(ls app/build/outputs/apk/debug/*.apk | head -n 1)
          DST="CorrectModeWidget-build${{ github.run_number }}-debug.apk"
          mkdir -p dist
          cp "$SRC" "dist/$DST"
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: CorrectModeWidget-build${{ github.run_number }}-debug
          path: dist/*.apk
          if-no-files-found: error
